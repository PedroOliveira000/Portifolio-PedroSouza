<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pedro Souza Design System</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/sable-source.css">
<style>
html,body{height:100%;overflow:hidden}
body{min-height:100vh}
.catalog-nav ul a[aria-current="page"]::after{transform:scaleX(1);transform-origin:left}
.catalog-nav ul a[aria-disabled="true"]{opacity:.38;cursor:default}
.catalog-nav .util a{white-space:nowrap}
.catalog-stage{height:calc(100vh - var(--nav));width:100%;overflow:hidden}
.catalog-stage iframe{display:block;width:100%;height:100%;border:0}
@media(max-width:900px){.catalog-nav ul{display:flex!important;gap:16px}.catalog-nav ul a{font-size:9px;letter-spacing:.08em}.catalog-nav .bar{gap:8px}.catalog-nav .mk{font-size:19px}.catalog-nav .util{font-size:9px;gap:8px}}

.catalog-nav .mk{font-size:clamp(13px,1.55vw,22px);letter-spacing:.1em;padding-left:.1em;white-space:nowrap}
.catalog-nav .bar{grid-template-columns:1fr auto 1fr}
.catalog-nav ul{justify-self:end}
.catalog-nav .brand-logo{display:block;width:58px;height:58px;object-fit:contain}
@media(max-width:900px){.catalog-nav .bar{grid-template-columns:1fr auto 1fr}.catalog-nav .brand-logo{width:48px;height:48px}}
</style>
</head>
<body>
<nav class="catalog-nav">
  <div class="wrap bar">
    <a href="#overview" aria-label="Pedro Souza — início"><img class="brand-logo" src="assets/pedro-logo.png" data-base64-src="assets/pedro-logo.png.base64" alt="Logo Pedro Souza"></a>
    <div class="mk">PEDRO SOUZA</div>
    <ul><li><a href="#overview" data-view="overview" aria-current="page">Overview</a></li></ul>
  </div>
</nav>
<main id="overview" class="catalog-stage">
<iframe name="overviewFrame" title="Pedro Souza Design System Overview" src="assets/overview/index.html"></iframe>
</main>
<script>
(function(){
  document.querySelectorAll('[data-base64-src]').forEach(function(img){
    fetch(img.dataset.base64Src).then(function(response){if(!response.ok)throw new Error('Logo não encontrada');return response.text()}).then(function(encoded){img.src='data:image/png;base64,'+encoded.trim()}).catch(function(){});
  });
  const tabs=[...document.querySelectorAll('[data-view]')];
  function select(){
    if(location.hash==='#components') history.replaceState(null,'','#overview');
    if(!location.hash) history.replaceState(null,'','#overview');
    tabs.forEach(a=>{if(a.getAttribute('href')===location.hash)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current')});
  }
  addEventListener('hashchange',select);
  select();
})();
</script>
</body>
</html>
